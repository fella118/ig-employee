name: publish
on:
  schedule:
    - cron: '7,22,37,52 * * * *'     # every 15 min, off the busy :00 minute (GitHub delays those most)
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Approvals from Telegram
        continue-on-error: true
        run: python3 approver.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      - name: Publish due posts
        run: python3 publisher.py
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN || secrets.IG_ACCES_TOKEN }}
          IG_USERNAME: sogixel
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      - name: Reply to new comments
        continue-on-error: true
        run: python3 comments.py
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN || secrets.IG_ACCES_TOKEN }}
          IG_USERNAME: sogixel
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Daily insights snapshot
        continue-on-error: true
        run: python3 insights.py
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN || secrets.IG_ACCES_TOKEN }}
          IG_USERNAME: sogixel
      - name: Save queue status
        run: |
          git config user.name "ig-employee"
          git config user.email "ig-employee@users.noreply.github.com"
          touch replied.json insights.json comments_log.md telegram.json
          git add queue.json log.md replied.json insights.json comments_log.md telegram.json
          git diff --cached --quiet || (git commit -m "publish run [skip ci]" && git pull --rebase && git push)
